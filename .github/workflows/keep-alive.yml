name: Keep alive

# Supabase pauses free projects after a week without activity.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_PROJECT_ID != ''
    steps:
      - run: curl --fail --silent --show-error --retry 3 "https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/api/health"
